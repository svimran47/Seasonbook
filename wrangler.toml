name = "seasonbook"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Static internal PWA served from ./public; worker handles /api/* and /calendar.ics
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Local dev database. REPLACE database_id with the real one after `npx wrangler d1 create seasonbook`
[[d1_databases]]
binding = "DB"
database_name = "seasonbook"
database_id = "local-only-placeholder"
