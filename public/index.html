<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Seasonbook</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <header class="top">

        <defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD37E"/><stop offset="1" stop-color="#D98A2B"/></linearGradient></defs>
        <rect x="28" y="54" width="200" height="160" rx="22" fill="#1E2532" />

        <line x1="66" y1="132" x2="190" y2="132" stroke="#2E3848" stroke-width="9" stroke-linecap="round"/>
        <line x1="66" y1="164" x2="190" y2="164" stroke="#2E3848" stroke-width="9" stroke-linecap="round"/>
        <path d="M118 10 H150 V90 L134 72 L118 90 Z" fill="url(#m)"/>

      <span>seasonbook</span>
